version: '3.8'

services:
  # 1. Jupyter + PySpark
  pyspark-jupyter:
    image: quay.io/jupyter/pyspark-notebook
    container_name: pyspark-jupyter
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./work:/home/jovyan/work
    environment:
      # KHÔNG cần tải jar thủ công nữa
      - PYSPARK_SUBMIT_ARGS=--packages org.postgresql:postgresql:42.6.0,org.apache.hadoop:hadoop-aws:3.4.2 pyspark-shell
    depends_on:
      - postgres
      - minio

  # 2. PostgreSQL
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=retail_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 3. MinIO
  minio:
    image: minio/minio:RELEASE.2023-08-09T23-30-22Z
    container_name: minio_storage
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # 4. Airflow (KHÔNG SQLite - dùng PostgreSQL)
  airflow:
    image: apache/airflow:2.9.1
    container_name: airflow_scheduler
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False

      # dùng PostgreSQL
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:admin@postgres:5432/airflow_db

      # executor ổn định hơn SQLite
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor

      - _PIP_ADDITIONAL_REQUIREMENTS=ccxt pandas boto3 psycopg2-binary

    depends_on:
      - postgres
      - minio

volumes:
  pgdata:
  miniodata: